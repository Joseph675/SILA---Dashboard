<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
  <div class="flex flex-1 flex-wrap items-end gap-3">
    <div class="w-full sm:w-72">
      <label for="productos-buscar" class="mb-1 block text-xs font-medium text-muted-foreground">Buscar</label>
      <div class="relative">
        <app-icon name="lucideSearch" class="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted-foreground" aria-hidden="true" />
        <input
          id="productos-buscar"
          type="search"
          class="sila-input ps-9"
          placeholder="SKU o nombre"
          maxlength="100"
          [value]="texto()"
          (input)="texto.set($any($event.target).value)"
        />
      </div>
    </div>
    <div>
      <label for="productos-estado" class="mb-1 block text-xs font-medium text-muted-foreground">Estado</label>
      <select id="productos-estado" class="sila-select w-36" [value]="filtroActivo()" (change)="cambiarFiltro($any($event.target).value)">
        <option value="TODOS">Todos</option>
        <option value="ACTIVOS">Activos</option>
        <option value="INACTIVOS">Inactivos</option>
      </select>
    </div>
  </div>
  <button *hasRole="'ADMIN'" type="button" class="sila-btn sila-btn-primary" (click)="abrir('crear')">
    <app-icon name="lucidePackagePlus" class="size-4" aria-hidden="true" />
    Nuevo producto
  </button>
</div>

<app-server-data-table
  titulo="Productos"
  [columns]="columnas"
  [page]="listado.datos()"
  [rowId]="productoId"
  [cargando]="listado.cargando()"
  [error]="listado.error()"
  [sort]="listado.sort()"
  vacioTitulo="No hay productos que coincidan"
  vacioAyuda="Cambia la búsqueda o el filtro de estado."
  (pageChange)="listado.irAPagina($event)"
  (sizeChange)="listado.cambiarTamano($event)"
  (sortChange)="listado.sort.set($event)"
  (reintentar)="listado.recargar()"
>
  <button *hasRole="'ADMIN'" accionVacio type="button" class="sila-btn sila-btn-outline sila-btn-sm" (click)="abrir('crear')">Nuevo producto</button>

  <ng-template appDataTableCell="codigo_sku" [cellRows]="listado.datos()?.items" let-producto>
    <span class="font-mono text-xs">{{ producto.codigo_sku }}</span>
  </ng-template>
  <ng-template appDataTableCell="nombre" [cellRows]="listado.datos()?.items" let-producto>
    <span class="font-medium">{{ producto.nombre }}</span>
  </ng-template>
  <ng-template appDataTableCell="precio_base" [cellRows]="listado.datos()?.items" let-producto>
    {{ cop(producto.precio_base) }}
  </ng-template>
  <ng-template appDataTableCell="tarifa_iva" [cellRows]="listado.datos()?.items" let-producto>
    {{ numero(producto.tarifa_iva) }} %
  </ng-template>
  <ng-template appDataTableCell="stock" [cellRows]="listado.datos()?.items" let-producto>
    <span class="inline-flex flex-wrap items-center justify-end gap-2">
      <span [class.text-muted-foreground]="producto.stock === 0" [class.text-destructive]="producto.bajo_minimo" [class.font-medium]="producto.bajo_minimo">{{ numero(producto.stock) }}</span>
      @if (producto.bajo_minimo) {
        <app-status-chip texto="Bajo el mínimo" tono="peligro" />
      }
    </span>
  </ng-template>
  <ng-template appDataTableCell="stock_minimo" [cellRows]="listado.datos()?.items" let-producto>
    <span class="tabular-nums" [class.text-muted-foreground]="producto.stock_minimo === 0">{{ producto.stock_minimo > 0 ? numero(producto.stock_minimo) : 'Sin alerta' }}</span>
  </ng-template>
  <ng-template appDataTableCell="activo" [cellRows]="listado.datos()?.items" let-producto>
    <app-status-chip [texto]="producto.activo ? 'Activo' : 'Inactivo'" [tono]="producto.activo ? 'exito' : 'neutro'" />
  </ng-template>
  <ng-template appDataTableCell="acciones" [cellRows]="listado.datos()?.items" let-producto>
    <div class="flex justify-end gap-1">
      <button type="button" class="sila-btn sila-btn-ghost sila-btn-sm" (click)="abrir('editar', producto)">
        <app-icon name="lucidePencil" class="size-3.5" aria-hidden="true" />
        Editar<span class="sr-only"> {{ producto.nombre }}</span>
      </button>
      <button type="button" class="sila-btn sila-btn-ghost sila-btn-sm" (click)="recetaDe.set({ id: producto.id_producto, editar: false })">
        <app-icon name="lucideListChecks" class="size-3.5" aria-hidden="true" />
        Receta<span class="sr-only"> de {{ producto.nombre }}</span>
      </button>
      <!-- Hiding is not security: the procedures reject OPERATIVO with 20008 anyway. -->
      <button *hasRole="'ADMIN'" type="button" class="sila-btn sila-btn-ghost sila-btn-sm" (click)="abrir('minimo', producto)">
        <app-icon name="lucideBellRing" class="size-3.5" aria-hidden="true" />
        Mínimo<span class="sr-only"> de {{ producto.nombre }}</span>
      </button>
      <button *hasRole="'ADMIN'" type="button" class="sila-btn sila-btn-ghost sila-btn-sm" (click)="abrir('precio', producto)">
        <app-icon name="lucideTag" class="size-3.5" aria-hidden="true" />
        Precio<span class="sr-only"> de {{ producto.nombre }}</span>
      </button>
      <button *hasRole="'ADMIN'" type="button" class="sila-btn sila-btn-ghost sila-btn-sm" (click)="cambiandoEstado.set(producto)">
        <app-icon name="lucidePower" class="size-3.5" aria-hidden="true" />
        {{ producto.activo ? 'Desactivar' : 'Activar' }}<span class="sr-only"> {{ producto.nombre }}</span>
      </button>
    </div>
  </ng-template>
</app-server-data-table>

<app-producto-form-dialog
  [abierto]="dialogo() !== null"
  [modo]="dialogo()?.modo ?? 'crear'"
  [producto]="dialogo()?.producto ?? null"
  (guardado)="alGuardar($event)"
  (recetaFallida)="alFallarReceta($event)"
  (cerrar)="dialogo.set(null)"
/>

<app-receta-dialog [idProducto]="recetaDe()?.id ?? null" [editarAlAbrir]="recetaDe()?.editar ?? false" (cerrar)="recetaDe.set(null)" (guardada)="listado.recargar()" />

<app-confirm-dialog
  [open]="cambiandoEstado() !== null"
  [titulo]="cambiandoEstado()?.activo ? 'Desactivar producto' : 'Activar producto'"
  [mensaje]="(cambiandoEstado()?.activo ? '¿Desactivar ' : '¿Activar ') + cambiandoEstado()?.nombre + '?'"
  [textoConfirmar]="cambiandoEstado()?.activo ? 'Desactivar' : 'Activar'"
  [peligro]="cambiandoEstado()?.activo ?? false"
  [ocupado]="procesandoEstado()"
  (confirmar)="confirmarEstado()"
  (cancelar)="cambiandoEstado.set(null)"
/>

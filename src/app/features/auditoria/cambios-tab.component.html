<app-filtros-plegables clases="mb-2 flex flex-wrap items-end gap-3">
  <div class="w-full sm:w-56">
    <label for="cambios-usuario" class="mb-1 block text-xs font-medium text-muted-foreground">Usuario</label>
    <input id="cambios-usuario" type="search" class="sila-input" placeholder="Contiene…" maxlength="100" [value]="usuario.crudo()" (input)="usuario.crudo.set($any($event.target).value)" />
  </div>
  <div class="w-44">
    <label for="cambios-tabla" class="mb-1 block text-xs font-medium text-muted-foreground">Tabla</label>
    <input id="cambios-tabla" type="search" class="sila-input font-mono" maxlength="60" [value]="tabla.crudo()" (input)="tabla.crudo.set($any($event.target).value)" />
  </div>
  <div class="w-44">
    <label for="cambios-columna" class="mb-1 block text-xs font-medium text-muted-foreground">Columna</label>
    <input id="cambios-columna" type="search" class="sila-input font-mono" maxlength="60" [value]="columna.crudo()" (input)="columna.crudo.set($any($event.target).value)" />
  </div>
  <app-filtro-fechas idBase="cambios" [desde]="desde()" [hasta]="hasta()" (desdeChange)="desde.set($event)" (hastaChange)="hasta.set($event)" />
</app-filtros-plegables>
<p class="mb-4 text-xs text-muted-foreground">Las fechas del filtro son días en UTC; las horas de la tabla están en hora de Colombia (UTC−5).</p>

<app-server-data-table
  titulo="Cambios"
  [columns]="columnas"
  [page]="listado.datos()"
  [rowId]="cambioId"
  [cargando]="listado.cargando()"
  [error]="listado.error()"
  [sort]="listado.sort()"
  vacioTitulo="No hay cambios que coincidan"
  vacioAyuda="Cambia los filtros o el rango de fechas."
  (pageChange)="listado.irAPagina($event)"
  (sizeChange)="listado.cambiarTamano($event)"
  (sortChange)="listado.sort.set($event)"
  (reintentar)="listado.recargar()"
>
  <ng-template appDataTableCell="fecha" [cellRows]="listado.datos()?.items" let-cambio>
    <span class="whitespace-nowrap">{{ fechaHora(cambio.fecha) }}</span>
  </ng-template>
  <ng-template appDataTableCell="usuario" [cellRows]="listado.datos()?.items" let-cambio>
    <span class="font-mono text-xs">{{ cambio.usuario ?? '—' }}</span>
  </ng-template>
  <ng-template appDataTableCell="tabla" [cellRows]="listado.datos()?.items" let-cambio>
    <span class="font-mono text-xs">{{ cambio.tabla }}</span>
  </ng-template>
  <ng-template appDataTableCell="id_registro" [cellRows]="listado.datos()?.items" let-cambio>
    <span class="font-mono text-xs">{{ cambio.id_registro ?? '—' }}</span>
  </ng-template>
  <ng-template appDataTableCell="columna" [cellRows]="listado.datos()?.items" let-cambio>
    <span class="font-mono text-xs">{{ cambio.columna }}</span>
  </ng-template>
  <!-- Values can be long: they are cut and the whole text is in the tooltip. -->
  <ng-template appDataTableCell="valor_anterior" [cellRows]="listado.datos()?.items" let-cambio>
    <span class="block max-w-48 truncate text-muted-foreground" [attr.title]="cambio.valor_anterior">{{ cambio.valor_anterior ?? '—' }}</span>
  </ng-template>
  <ng-template appDataTableCell="valor_nuevo" [cellRows]="listado.datos()?.items" let-cambio>
    <span class="block max-w-48 truncate font-medium" [attr.title]="cambio.valor_nuevo">{{ cambio.valor_nuevo ?? '—' }}</span>
  </ng-template>
</app-server-data-table>

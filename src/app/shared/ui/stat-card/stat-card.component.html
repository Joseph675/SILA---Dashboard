<div class="group relative overflow-hidden rounded-xl border bg-card text-card-foreground shadow-sm">
  <div class="p-5 pb-0">
    <div class="flex items-start justify-between">
      <div class="space-y-2">
        <p class="text-xs font-medium text-muted-foreground">{{ title() }}</p>
        <p class="text-2xl font-bold tracking-tight">{{ value() }}</p>
        <div class="flex items-center gap-1.5">
          <app-icon
            [name]="deltaDirection() === 'up' ? 'lucideTrendingUp' : 'lucideTrendingDown'"
            class="h-3.5 w-3.5"
            [class.text-success]="deltaDirection() === 'up'"
            [class.text-destructive]="deltaDirection() === 'down'"
          />
          <span class="text-xs font-semibold" [class.text-success]="deltaDirection() === 'up'" [class.text-destructive]="deltaDirection() === 'down'">
            {{ deltaLabel() }}
          </span>
          <span class="text-xs text-muted-foreground">{{ comparisonLabel() }}</span>
        </div>
      </div>
      <div class="flex h-10 w-10 items-center justify-center rounded-xl transition-transform group-hover:scale-110" [class]="iconWrapClass()">
        <app-icon [name]="icon()" class="h-5 w-5" />
      </div>
    </div>
  </div>
  <div class="h-12 w-full">
    <apx-chart
      [chart]="chart"
      [series]="series()"
      [stroke]="stroke"
      [xaxis]="xaxis"
      [yaxis]="yaxis"
      [tooltip]="tooltip"
      [fill]="fill()"
      [colors]="colors()"
    />
  </div>
</div>

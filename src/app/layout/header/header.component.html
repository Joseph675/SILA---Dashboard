<div class="sticky top-0 z-30">
  <header class="sila-header flex h-16 items-center justify-between border-b border-border bg-background/80 px-3 backdrop-blur-xl sm:px-6">
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="flex h-11 w-11 items-center justify-center rounded-lg text-muted-foreground transition-colors hover:bg-accent hover:text-foreground lg:hidden"
        aria-label="Abrir menú"
        [attr.aria-expanded]="sidebarState.mobileOpen()"
        (click)="sidebarState.openMobile()"
      >
        <app-icon name="lucideMenu" class="h-5 w-5" />
      </button>

      <button
        type="button"
        class="relative hidden h-9 w-72 items-center rounded-lg border border-input bg-muted/40 ps-9 pe-4 text-start text-sm text-muted-foreground/50 transition-colors hover:bg-muted/60 lg:flex"
      >
        <app-icon name="lucideSearch" class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground/60" />
        Search...
        <kbd class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 rounded border border-border bg-muted px-1.5 text-[10px] font-medium text-muted-foreground">
          &#8984;K
        </kbd>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <app-quincena-chip />

      <div class="mx-1 hidden h-6 w-px bg-border sm:block"></div>

      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-muted-foreground transition-colors hover:bg-accent hover:text-foreground"
        aria-label="Toggle theme"
        (click)="toggleColorScheme()"
      >
        <app-icon name="lucideMoon" class="h-4 w-4" [class.hidden]="theme.mode() === 'dark'" />
        <app-icon name="lucideSun" class="h-4 w-4" [class.hidden]="theme.mode() !== 'dark'" />
      </button>

      <button
        type="button"
        class="hidden h-8 w-8 items-center justify-center rounded-lg text-muted-foreground transition-colors hover:bg-accent hover:text-foreground sm:flex"
        aria-label="Customize theme"
        (click)="customizer.toggle()"
      >
        <app-icon name="lucidePalette" class="h-4 w-4" />
      </button>

      <div class="relative hidden sm:block">
        <button
          type="button"
          class="relative flex h-8 w-8 items-center justify-center rounded-lg text-muted-foreground transition-colors hover:bg-accent hover:text-foreground"
          aria-label="Notifications"
          [attr.aria-expanded]="notificationsOpen()"
          (click)="toggleNotifications()"
        >
          <app-icon name="lucideBell" class="h-4 w-4" />
          <span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-destructive"></span>
        </button>
        <div
          class="absolute end-0 mt-2 w-80 origin-top-right rounded-xl border border-border bg-popover p-0 text-popover-foreground shadow-xl"
          [class.hidden]="!notificationsOpen()"
        >
          <div class="flex items-center justify-between border-b border-border px-4 py-3">
            <p class="text-sm font-semibold">Notifications</p>
            <a href="#" class="text-xs font-medium text-primary hover:underline">Mark all read</a>
          </div>
          <div class="max-h-80 overflow-y-auto p-2">
            @for (n of notifications; track n.title) {
              <div class="flex gap-3 rounded-lg px-2 py-2.5 transition-colors hover:bg-muted">
                <div class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-muted">
                  <app-icon [name]="n.icon" class="h-4 w-4" [class]="n.iconClass" />
                </div>
                <div class="flex-1 space-y-0.5">
                  <p class="text-sm font-medium leading-snug">{{ n.title }}</p>
                  <p class="text-xs leading-snug text-muted-foreground">{{ n.description }}</p>
                  <p class="text-[11px] text-muted-foreground/60">{{ n.time }}</p>
                </div>
              </div>
            }
          </div>
          <div class="border-t border-border p-2">
            <a href="#" class="flex items-center justify-center gap-1 rounded-lg px-2 py-2 text-xs font-medium text-primary hover:bg-muted">
              View all
              <app-icon name="lucideArrowUpRight" class="h-3.5 w-3.5" />
            </a>
          </div>
        </div>
      </div>

      <app-user-menu />
    </div>
  </header>
</div>
